name: Binaries

# Build a standalone executable (no Python needed) for Linux / Windows / macOS
# and attach it to the GitHub Release. Runs after a release is published.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build with PyInstaller
        run: >
          uv run --with . --with pyinstaller --with lxml
          pyinstaller --onefile --name freeflix
          --collect-all curl_cffi
          --collect-submodules freeflix_cli
          --hidden-import readchar
          --copy-metadata readchar
          --copy-metadata freeflix-cli
          --copy-metadata curl_cffi
          src/freeflix_cli/__main__.py

      - name: Smoke-test the binary
        shell: bash
        run: |
          if [ -f dist/freeflix.exe ]; then BIN=dist/freeflix.exe; else BIN=dist/freeflix; fi
          "$BIN" --version

      - name: Name the artifact
        shell: bash
        run: |
          cd dist
          if [ -f freeflix.exe ]; then
            mv freeflix.exe "freeflix-${{ matrix.name }}.exe"
          else
            mv freeflix "freeflix-${{ matrix.name }}"
          fi

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/freeflix-${{ matrix.name }}*
